basePath: /
definitions:
  apierror.APIError:
    properties:
      code:
        example: DTE-001
        type: string
      detail:
        example: The image field is required
        type: string
      instance:
        example: /api/v1/events
        type: string
      status:
        example: 400
        type: integer
      title:
        example: Bad Request
        type: string
      type:
        example: about:blank
        type: string
    type: object
  domain.AddPersonImagesRequest:
    properties:
      images:
        items:
          type: string
        type: array
    required:
    - images
    type: object
  domain.ContactCreateInput:
    properties:
      cellphone:
        type: string
      email:
        type: string
      userId:
        type: string
    required:
    - email
    type: object
  domain.ContactSummary:
    properties:
      cellphone:
        type: string
      email:
        type: string
      userId:
        type: string
    type: object
  domain.ContactUpdateInput:
    properties:
      cellphone:
        type: string
      email:
        type: string
      userId:
        type: string
    type: object
  domain.CreatePersonWithContactRequest:
    properties:
      contact:
        $ref: '#/definitions/domain.ContactCreateInput'
      firstName:
        type: string
      images:
        items:
          type: string
        minItems: 3
        type: array
      lastName:
        type: string
      role:
        type: string
    required:
    - firstName
    - images
    - lastName
    - role
    type: object
  domain.DeviceResponseDto:
    properties:
      city:
        type: string
      createdAt:
        type: string
      detectionThreshold:
        type: integer
      deviceId:
        type: string
      firmwareVersion:
        type: string
      lastBoot:
        type: string
      lastSeen:
        type: string
      location:
        type: string
      name:
        type: string
      serialNumber:
        type: string
      status:
        type: string
      uptime:
        type: integer
    type: object
  domain.Event:
    properties:
      deviceId:
        type: string
      eventType:
        type: string
      id:
        type: string
      imageUrl:
        type: string
      intruder:
        type: boolean
      timestamp:
        type: string
    type: object
  domain.EventsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/domain.Event'
        type: array
    type: object
  domain.LinkDeviceRequest:
    properties:
      deviceId:
        type: string
      name:
        type: string
    type: object
  domain.LoginData:
    properties:
      accessToken:
        type: string
      refreshToken:
        type: string
    type: object
  domain.LoginRequest:
    properties:
      email:
        type: string
      password:
        type: string
    type: object
  domain.LoginResponse:
    properties:
      data:
        $ref: '#/definitions/domain.LoginData'
    type: object
  domain.Person:
    properties:
      deviceId:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.PersonImage'
        type: array
      name:
        type: string
      role:
        type: string
    type: object
  domain.PersonImage:
    properties:
      id:
        type: integer
      imageUrl:
        type: string
    type: object
  domain.PersonWithContact:
    properties:
      contact:
        $ref: '#/definitions/domain.ContactSummary'
      firstName:
        type: string
      id:
        type: string
      images:
        items:
          $ref: '#/definitions/domain.PersonImage'
        type: array
      isOwner:
        type: boolean
      lastName:
        type: string
      role:
        type: string
    type: object
  domain.RegisterPushTokenRequest:
    properties:
      deviceName:
        type: string
      platform:
        type: string
      pushToken:
        type: string
    type: object
  domain.RegisterRequest:
    properties:
      email:
        type: string
      firstName:
        type: string
      lastName:
        type: string
      password:
        type: string
    type: object
  domain.UpdateDeviceRequest:
    properties:
      city:
        type: string
      detectionThreshold:
        type: integer
      location:
        type: string
    type: object
  domain.UpdatePersonWithContactRequest:
    properties:
      contact:
        $ref: '#/definitions/domain.ContactUpdateInput'
      firstName:
        type: string
      images:
        items:
          type: string
        type: array
      lastName:
        type: string
      role:
        type: string
    type: object
  domain.User:
    properties:
      createdAt:
        type: string
      email:
        type: string
      firstName:
        type: string
      id:
        type: string
      lastName:
        type: string
    type: object
  domain.UserResponse:
    properties:
      data:
        $ref: '#/definitions/domain.User'
    type: object
host: localhost:8080
info:
  contact: {}
  description: App gateway for the Secure Home project — routes microcontroller events
    to the detection service.
  title: Secure Home Gateway API
  version: "1.0"
paths:
  /api/v1/auth/register:
    post:
      consumes:
      - application/json
      description: Creates auth credentials and user profile
      parameters:
      - description: Register payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/domain.UserResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Register a new user
      tags:
      - auth
  /api/v1/login:
    post:
      consumes:
      - application/json
      description: Authenticates user credentials and returns auth tokens
      parameters:
      - description: Login payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LoginRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.LoginResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      summary: Login user
      tags:
      - auth
  /api/v1/me/device:
    delete:
      description: Removes the linked device from the authenticated user
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Unlink device from authenticated user
      tags:
      - users
    get:
      description: Returns the authenticated user's linked device
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DeviceResponseDto'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Get my linked device
      tags:
      - users
    patch:
      consumes:
      - application/json
      description: Partially updates the authenticated user's linked device. Only
        city, detectionThreshold and location can be modified.
      parameters:
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdateDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DeviceResponseDto'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Update my linked device
      tags:
      - users
    post:
      consumes:
      - application/json
      description: Associates a device with the authenticated user
      parameters:
      - description: Device payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.LinkDeviceRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.DeviceResponseDto'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Link device to authenticated user
      tags:
      - users
  /api/v1/me/device/events:
    get:
      description: Returns all events associated with the authenticated user's linked
        device
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.EventsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Get authenticated user's device events
      tags:
      - users
  /api/v1/me/device/persons:
    get:
      description: Returns all persons with their contact info registered on the authenticated
        user's linked device
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/domain.PersonWithContact'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: List persons for authenticated user's device
      tags:
      - persons
    post:
      consumes:
      - application/json
      description: Registers a new person with face images and contact information
        on the linked device
      parameters:
      - description: Person with contact payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.CreatePersonWithContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PersonWithContact'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Create a person with contact on the authenticated user's device
      tags:
      - persons
  /api/v1/me/device/persons/{personId}:
    delete:
      description: Removes a registered person and their associated contact; NotFound
        from either service is tolerated
      parameters:
      - description: Person ID
        in: path
        name: personId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Delete a person and their contact from the authenticated user's device
      tags:
      - persons
    get:
      description: Returns a single person with their contact info registered on the
        linked device
      parameters:
      - description: Person ID
        in: path
        name: personId
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PersonWithContact'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Get a person by ID from the authenticated user's device
      tags:
      - persons
    patch:
      consumes:
      - application/json
      description: Updates person and/or contact fields; all fields are optional
      parameters:
      - description: Person ID
        in: path
        name: personId
        required: true
        type: string
      - description: Fields to update
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.UpdatePersonWithContactRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.PersonWithContact'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Partially update a person and their contact on the authenticated user's
        device
      tags:
      - persons
  /api/v1/me/device/persons/{personId}/images:
    post:
      consumes:
      - application/json
      description: Adds one or more base64-encoded face images to a registered person
      parameters:
      - description: Person ID
        in: path
        name: personId
        required: true
        type: string
      - description: Images payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.AddPersonImagesRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/domain.Person'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Add face images to a person
      tags:
      - persons
  /api/v1/me/device/persons/{personId}/images/{imageId}:
    delete:
      description: Removes a specific face image from a registered person
      parameters:
      - description: Person ID
        in: path
        name: personId
        required: true
        type: string
      - description: Image ID
        in: path
        name: imageId
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Delete a face image from a person
      tags:
      - persons
  /api/v1/me/push-token:
    post:
      consumes:
      - application/json
      description: Registers or updates the FCM push token for the authenticated user's
        device
      parameters:
      - description: Push token payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/domain.RegisterPushTokenRequest'
      responses:
        "200":
          description: OK
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/apierror.APIError'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Register push notification token
      tags:
      - users
  /api/v1/me/push-token/{appDeviceId}:
    delete:
      description: Removes the push token from an app device without deleting the
        device
      parameters:
      - description: App Device ID
        in: path
        name: appDeviceId
        required: true
        type: integer
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/apierror.APIError'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/apierror.APIError'
      security:
      - BearerAuth: []
      summary: Delete push notification token
      tags:
      - users
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
